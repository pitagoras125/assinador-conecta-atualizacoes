name: Distribuir Windows 1.3.2 pelo atualizador
on:
  push:
    paths: ['.github/workflows/windows-channel-132.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validar arquivos e publicar o canal
        run: |
          set -euo pipefail
          tag=windows-v1.3.2
          exe=Instalar_Conecta_PDF_1.3.2.exe
          apk=Conecta-PDF-0.8.0-Android-arm64.apk
          gh release download v1.3.2 -R pitagoras125/ASSINADOR-CONECTA -p "$exe"
          gh release download v0.8.0 -p update.json -p "$apk"
          cat > desktop-update.json <<'JSON'
          {"payload":{"app":"conecta-pdf-windows","version":"1.3.2","url":"https://github.com/pitagoras125/assinador-conecta-atualizacoes/releases/download/windows-v1.3.2/Instalar_Conecta_PDF_1.3.2.exe","sha256":"a582671f5e3ccbd99d443ff2d376704f17fc02eff313c6d94a088833f196c202","size":87648299,"terms_sha256":"8c99aee48516c431550b62e30b707e3ff00c19cfda0afcbc22dc166c6de8aaae"},"signature":"0P81uDV8ofqYdNBH+hQ1EY30/GIqgpoRhSunof2wQ6k27eXWJC4Y043Lwul9Iq+48Lgdh2oHzXxyuNnN2XGbDg=="}
          JSON
          printf '%s  %s\n' "$(jq -er .payload.sha256 desktop-update.json)" "$exe" "$(jq -er .sha256 update.json)" "$apk" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c %s "$exe")" = "$(jq -er .payload.size desktop-update.json)"
          gh release create "$tag" --draft --title 'Conecta PDF — Windows 1.3.2 e Android 0.8.0' --notes 'Atualização do Windows pelo próprio Conecta PDF.'
          gh release upload "$tag" "$exe" desktop-update.json update.json "$apk" SHA256SUMS.txt
          gh release edit "$tag" --draft=false --latest
