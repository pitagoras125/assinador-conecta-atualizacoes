name: Distribuir Windows 1.3.1 pelo atualizador
on:
  push:
    paths: ['.github/workflows/windows-channel-131.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validar arquivos e publicar o canal
        run: |
          set -euo pipefail
          tag=windows-v1.3.1
          exe=Instalar_Conecta_PDF_1.3.1.exe
          apk=Conecta-PDF-0.8.0-Android-arm64.apk
          gh release download v1.3.1 -R pitagoras125/ASSINADOR-CONECTA -p "$exe"
          gh release download v0.8.0 -p update.json -p "$apk"
          cat > desktop-update.json <<'JSON'
          {"payload":{"app":"conecta-pdf-windows","version":"1.3.1","url":"https://github.com/pitagoras125/assinador-conecta-atualizacoes/releases/download/windows-v1.3.1/Instalar_Conecta_PDF_1.3.1.exe","sha256":"854d854cbeecd8b89138d43f1225658ef8ae02a8429cd4bc8cb997ea4a8dc487","size":87662989},"signature":"N7zkc0dNgeDaZG3T1WrnJXA8bFRGeiyFMz1xdB04w201wUk6WEYgLAhR3zTiD3gj1mK6iijg3mQzmnwZ1VvEDQ=="}
          JSON
          printf '%s  %s\n' "$(jq -er .payload.sha256 desktop-update.json)" "$exe" "$(jq -er .sha256 update.json)" "$apk" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c %s "$exe")" = "$(jq -er .payload.size desktop-update.json)"
          gh release create "$tag" --draft --title 'Conecta PDF — Windows 1.3.1 e Android 0.8.0' --notes 'Atualização do Windows pelo próprio Conecta PDF.'
          gh release upload "$tag" "$exe" desktop-update.json update.json "$apk" SHA256SUMS.txt
          gh release edit "$tag" --draft=false --latest
